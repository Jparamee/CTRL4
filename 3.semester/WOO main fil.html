<!DOCTYPE html>
<html lang="en">
<head>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <link rel="stylesheet" href="decor.css">
    <link rel="script" href="API.js"></link>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WOO triple file setup</title>
</head>
<body>

<div id="vueApp">
    <!-- NAV -->
    <nav class="navbar">
        <div class="logo">WOO</div>
        <input class="search-bar" placeholder="Search..." />
        <div class="nav-links">
            <span>Home</span>
            <span>Upcoming</span>
            <span>Watchlist</span>
            <span>Profile</span>
        </div>
    </nav>

    <!-- GAME HEADER -->
    <section class="game-header">
        <div class="game-media">
            <img class="game-cover" :src="gameCoverSrc" alt="Game cover" />

            <div class="reviews">
                <div class="stars">★★★★★</div>
                <div class="review-count">(1,284 reviews)</div>
                <a href="#">Read reviews</a>
            </div>
        </div>

        <div class="game-info">
            <h1>{{gameTitle}}</h1>

            <div class="tags">
                <span class="tag">Tag1</span>
                <span class="tag">Tag2</span>
                <span class="tag">tag3</span>
            </div>

            <p class="description">
                placeholder text here
            </p>
        </div>

        <div class="price-card">
            <div class="price">3 €</div>
            <small>Tekst go here</small>
        </div>
    </section>

    <!-- LOWER SECTION -->
    <section class="game-header">
        <div class="card similar-games">
            <h3>Similar games</h3>
            <img src="xxx" />
            <p>Placeholder here</p>
        </div>

        <div class="chart-container">
            <h3>Price history</h3>
            <div style="height: 200px; opacity: 0.4">
                (Chart placeholder)
            </div>
        </div>
    </section>
</div>
